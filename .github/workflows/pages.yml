# Publishes the static game folder (public/stickclash) to GitHub Pages. No build step needed.
name: Deploy STICK CLASH to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.name.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - id: name
        run: echo "value=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: public/stickclash
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.package.outputs.artifact-name }}
